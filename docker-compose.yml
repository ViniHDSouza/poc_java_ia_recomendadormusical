services:
  postgres:
    image: postgres:16-alpine
    container_name: poc-recomendador-musical-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-song_recommender}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-song_recommender}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - song_recommender_postgres_data:/var/lib/postgresql/data

volumes:
  song_recommender_postgres_data:
